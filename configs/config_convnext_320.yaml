# ============================================================================
# NIH Chest X-ray14 — ConvNeXt-Base 320px Fine-tune Config
# Fine-tunes from the 224px checkpoint at higher resolution.
# Resolution increase benefits: nodule borders, fibrosis texture, effusion margins.
#
# Usage:
#   python -m src.train --config configs/config_convnext_320.yaml
#   (finetune_from is set below — points to the 224px checkpoint)
# ============================================================================

# --- Dataset ---
dataset:
  name: "alkzar90/NIH-Chest-X-ray-dataset"
  subset: "image-classification"
  num_classes: 15
  streaming: false
  stream_buffer_size: 10000
  patient_split:
    train: 0.82
    val: 0.15
    test: 0.15
    seed: 42

# --- Data Paths (update for each machine) ---
data:
  csv_path:       "data/NIH_chest_x-ray/Data_Entry_2017.csv"
  image_dir:      "data/NIH_chest_x-ray/images"
  train_val_list: "data/NIH_chest_x-ray/train_val_list.txt"
  test_list:      "data/NIH_chest_x-ray/test_list.txt"

# --- Preprocessing ---
preprocessing:
  image_size: 320             # Higher resolution — ~2x memory vs 224px
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  grayscale_to_rgb: true

# --- Augmentation ---
augmentation:
  train:
    random_horizontal_flip: 0.5
    random_rotation: 10
    random_resized_crop:
      scale: [0.85, 1.0]
      ratio: [0.9, 1.1]
    color_jitter:
      brightness: 0.15
      contrast: 0.15
    random_affine:
      translate: [0.05, 0.05]
      shear: 8
    random_erasing: 0.1
  val:
    center_crop: true

# --- Model ---
model:
  architecture: "convnext_base"
  pretrained: false           # Weights loaded from finetune_from below
  drop_rate: 0.3
  drop_path_rate: 0.3         # Slightly lower for fine-tuning
  freeze_backbone: false      # Start fully unfrozen (backbone already learned)
  freeze_epochs: 0

# --- Training ---
training:
  finetune_from: "checkpoints/best_model_convnext_base.pt"   # Warm-start backbone

  epochs: 30                  # Fine-tuning converges faster
  batch_size: 32              # 320px at 17GB — fits with AMP
  batch_size_mac: 4
  num_workers: 8
  num_workers_mac: 4
  pin_memory: true

  optimizer: "adamw"
  learning_rate: 2.0e-4       # Lower LR for fine-tuning
  backbone_lr: 2.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]

  scheduler: "cosine_warmup"
  warmup_epochs: 2
  min_lr: 1.0e-7

  loss: "asymmetric"
  focal_gamma: 2.0
  focal_alpha: 0.25
  label_smoothing: 0.05

  amp: true
  gradient_accumulation_steps: 8   # effective batch = 32 * 8 = 256

  mixup_alpha: 0.3

  swa:
    enabled: true
    start_epoch: 22            # Average last 8 epochs
    lr: 1.0e-6

  early_stopping:
    patience: 8
    metric: "val_auc_mean"
    mode: "max"

  save_top_k: 3
  checkpoint_dir: "checkpoints"

# --- Evaluation ---
evaluation:
  optimize_thresholds: true
  threshold_metric: "f1"
  default_threshold: 0.5
  gradcam:
    enabled: true
    target_layers: "auto"
    num_samples: 50
  metrics:
    - "auc_roc"
    - "auc_pr"
    - "f1"
    - "precision"
    - "recall"
    - "specificity"

# --- Logging ---
logging:
  project_name: "nih-chest-xray"
  use_wandb: true
  log_every_n_steps: 50
  save_figures: true
  figure_dir: "outputs/figures"

# --- Hardware ---
hardware:
  accelerator: "auto"
  strategy: "auto"
  precision: "16-mixed"
