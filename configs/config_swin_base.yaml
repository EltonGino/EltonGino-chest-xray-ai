# ============================================================================
# NIH Chest X-ray14 — Swin-Base Training Config
# Swin Transformer B/4/7 — ImageNet-22k pretrained, 88M params
# Different inductive bias from ConvNets → adds ensemble diversity
# ============================================================================

# --- Dataset ---
dataset:
  name: "alkzar90/NIH-Chest-X-ray-dataset"
  subset: "image-classification"
  num_classes: 15
  streaming: false
  stream_buffer_size: 10000
  patient_split:
    train: 0.82
    val: 0.15
    test: 0.15
    seed: 42

# --- Data Paths (update for each machine) ---
data:
  csv_path:       "data/NIH_chest_x-ray/Data_Entry_2017.csv"
  image_dir:      "data/NIH_chest_x-ray/images"
  train_val_list: "data/NIH_chest_x-ray/train_val_list.txt"
  test_list:      "data/NIH_chest_x-ray/test_list.txt"

# --- Preprocessing ---
preprocessing:
  image_size: 224
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  grayscale_to_rgb: true

# --- Augmentation ---
augmentation:
  train:
    random_horizontal_flip: 0.5
    random_rotation: 15
    random_resized_crop:
      scale: [0.8, 1.0]
      ratio: [0.9, 1.1]
    color_jitter:
      brightness: 0.2
      contrast: 0.2
    random_affine:
      translate: [0.05, 0.05]
      shear: 10
    random_erasing: 0.1
  val:
    center_crop: true

# --- Model ---
model:
  architecture: "swin_base"
  pretrained: true
  drop_rate: 0.3
  drop_path_rate: 0.4
  freeze_backbone: true
  freeze_epochs: 8

# --- Training ---
training:
  epochs: 60
  batch_size: 48              # Swin-B at 224px — fits with AMP on 17GB
  batch_size_mac: 8
  num_workers: 8
  num_workers_mac: 4
  pin_memory: true

  optimizer: "adamw"
  learning_rate: 1.0e-3
  backbone_lr: 1.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]

  scheduler: "cosine_warmup"
  warmup_epochs: 3
  min_lr: 1.0e-7

  loss: "asymmetric"
  focal_gamma: 2.0
  focal_alpha: 0.25
  label_smoothing: 0.05       # Soft targets help with NIH label noise

  amp: true
  gradient_accumulation_steps: 5   # effective batch = 48 * 5 = 240

  mixup_alpha: 0.4             # MixUp regularization

  swa:
    enabled: true
    start_epoch: 48            # Average last 12 epochs
    lr: 5.0e-6

  early_stopping:
    patience: 10
    metric: "val_auc_mean"
    mode: "max"

  save_top_k: 3
  checkpoint_dir: "checkpoints"

# --- Evaluation ---
evaluation:
  optimize_thresholds: true
  threshold_metric: "f1"
  default_threshold: 0.5
  gradcam:
    enabled: true
    target_layers: "auto"
    num_samples: 50
  metrics:
    - "auc_roc"
    - "auc_pr"
    - "f1"
    - "precision"
    - "recall"
    - "specificity"

# --- Logging ---
logging:
  project_name: "nih-chest-xray"
  use_wandb: true
  log_every_n_steps: 50
  save_figures: true
  figure_dir: "outputs/figures"

# --- Hardware ---
hardware:
  accelerator: "auto"
  strategy: "auto"
  precision: "16-mixed"
