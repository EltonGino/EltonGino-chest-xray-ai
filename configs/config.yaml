# ============================================================================
# NIH Chest X-ray14 — Multi-Label Classification Pipeline
# Configuration File
# ============================================================================

# --- Dataset ---
dataset:
  name: "alkzar90/NIH-Chest-X-ray-dataset"
  subset: "image-classification"
  num_classes: 15  # 14 diseases + No Finding
  class_names:
    - "No Finding"
    - "Atelectasis"
    - "Cardiomegaly"
    - "Effusion"
    - "Infiltration"
    - "Mass"
    - "Nodule"
    - "Pneumonia"
    - "Pneumothorax"
    - "Consolidation"
    - "Edema"
    - "Emphysema"
    - "Fibrosis"
    - "Pleural_Thickening"
    - "Hernia"
  # Use streaming to avoid downloading ~45GB upfront
  streaming: false
  # Number of samples to buffer for streaming (adjust based on RAM)
  stream_buffer_size: 10000
  # Patient-level split to prevent data leakage
  patient_split:
    train: 0.82
    val: 0.15
    test: 0.15
    seed: 42

# --- Preprocessing ---
preprocessing:
  image_size: 384          # Native resolution for EfficientNetV2-S pretrained weights
  image_size_large: 512    # For fine-tuning phase
  normalization:
    mean: [0.485, 0.456, 0.406]  # ImageNet defaults
    std: [0.229, 0.224, 0.225]
  # CXR-specific: images are grayscale, replicate to 3 channels
  grayscale_to_rgb: true

# --- Augmentation ---
augmentation:
  train:
    random_horizontal_flip: 0.5
    random_rotation: 15
    random_resized_crop:
      scale: [0.8, 1.0]
      ratio: [0.9, 1.1]
    color_jitter:
      brightness: 0.2
      contrast: 0.2
    random_affine:
      translate: [0.05, 0.05]
      shear: 10
    random_erasing: 0.1
  val:
    center_crop: true

# --- Model ---
model:
  # Options: "efficientnet_v2_s", "efficientnet_v2_m", "convnext_tiny",
  #          "convnext_small", "vit_base_patch16_224", "vit_small_patch16_224"
  architecture: "efficientnet_v2_s"
  pretrained: true
  drop_rate: 0.3
  drop_path_rate: 0.2
  # For ViT models
  vit_patch_size: 16
  # Freeze backbone initially for transfer learning
  freeze_backbone: true
  freeze_epochs: 5  # Unfreeze after N epochs

# --- Training ---
training:
  epochs: 30
  batch_size: 32           # RTX 5070 Ti (16GB) at 384px
  batch_size_mac: 16       # Mac Mini M-series at 384px
  num_workers: 8
  num_workers_mac: 4
  pin_memory: true

  # Optimizer
  optimizer: "adamw"
  learning_rate: 1.0e-3       # Head LR (frozen backbone phase)
  backbone_lr: 1.0e-5         # Backbone LR (after unfreeze)
  weight_decay: 0.01
  betas: [0.9, 0.999]

  # Scheduler
  scheduler: "cosine_warmup"
  warmup_epochs: 3
  min_lr: 1.0e-7
  
  # Loss
  loss: "asymmetric"  # Options: "bce", "focal", "asymmetric"
  focal_gamma: 2.0
  focal_alpha: 0.25

  # Mixed precision
  amp: true

  # Gradient accumulation (effective batch = batch_size * accum_steps)
  gradient_accumulation_steps: 2

  # Early stopping
  early_stopping:
    patience: 7
    metric: "val_auc_mean"
    mode: "max"

  # Checkpointing
  save_top_k: 3
  checkpoint_dir: "checkpoints"

# --- Evaluation ---
evaluation:
  # Per-class threshold optimization on validation set
  optimize_thresholds: true
  threshold_metric: "f1"  # Optimize F1 per class
  default_threshold: 0.5
  
  # Grad-CAM visualization
  gradcam:
    enabled: true
    target_layers: "auto"  # Auto-detect last conv layer
    num_samples: 50

  # Metrics to track
  metrics:
    - "auc_roc"
    - "auc_pr"
    - "f1"
    - "precision"
    - "recall"
    - "specificity"

# --- Logging ---
logging:
  project_name: "nih-chest-xray"
  use_wandb: false           # Set true if you have W&B
  log_every_n_steps: 50
  save_figures: true
  figure_dir: "outputs/figures"

# --- Hardware ---
hardware:
  # Auto-detect: cuda > mps > cpu
  accelerator: "auto"
  # For multi-GPU (if available)
  strategy: "auto"
  precision: "16-mixed"      # bf16-mixed on Ampere+
