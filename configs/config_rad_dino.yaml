# ============================================================================
# NIH Chest X-ray14 — Rad-DINO Config
# microsoft/rad-dino: ViT-B/14 pretrained on chest X-rays via DINO
# Medical-domain pretraining is the single highest-impact improvement.
# Expect faster convergence and better weak-class (Pneumonia, Nodule) AUC.
#
# Requirements:
#   pip install huggingface_hub   (already pulled by timm >= 1.0)
#   timm will download ~350MB model on first run
# ============================================================================

# --- Dataset ---
dataset:
  name: "alkzar90/NIH-Chest-X-ray-dataset"
  subset: "image-classification"
  num_classes: 15
  streaming: false
  stream_buffer_size: 10000
  patient_split:
    train: 0.82
    val: 0.15
    test: 0.15
    seed: 42

# --- Data Paths (update for each machine) ---
data:
  csv_path:       "data/NIH_chest_x-ray/Data_Entry_2017.csv"
  image_dir:      "data/NIH_chest_x-ray/images"
  train_val_list: "data/NIH_chest_x-ray/train_val_list.txt"
  test_list:      "data/NIH_chest_x-ray/test_list.txt"

# --- Preprocessing ---
preprocessing:
  image_size: 224             # rad-dino uses ViT-B/14 → 224px = 16×16 patches
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  grayscale_to_rgb: true

# --- Augmentation ---
augmentation:
  train:
    random_horizontal_flip: 0.5
    random_rotation: 15
    random_resized_crop:
      scale: [0.8, 1.0]
      ratio: [0.9, 1.1]
    color_jitter:
      brightness: 0.15
      contrast: 0.15
    random_affine:
      translate: [0.05, 0.05]
      shear: 8
    random_erasing: 0.1
  val:
    center_crop: true

# --- Model ---
model:
  architecture: "rad_dino"
  pretrained: true            # Loads microsoft/rad-dino from HuggingFace Hub
  drop_rate: 0.3
  drop_path_rate: 0.1         # ViT handles this internally; may be ignored
  freeze_backbone: true
  freeze_epochs: 5            # Shorter freeze — already domain-adapted

# --- Training ---
training:
  epochs: 40
  batch_size: 48              # ViT-B/14 at 224px, AMP — fits comfortably
  batch_size_mac: 8
  num_workers: 8
  num_workers_mac: 4
  pin_memory: true

  optimizer: "adamw"
  learning_rate: 5.0e-4       # Lower head LR — features are already medical
  backbone_lr: 5.0e-6
  weight_decay: 0.01
  betas: [0.9, 0.999]

  scheduler: "cosine_warmup"
  warmup_epochs: 3
  min_lr: 1.0e-7

  loss: "asymmetric"
  focal_gamma: 2.0
  focal_alpha: 0.25
  label_smoothing: 0.05

  amp: true
  gradient_accumulation_steps: 5   # effective batch = 48 * 5 = 240

  mixup_alpha: 0.3

  swa:
    enabled: true
    start_epoch: 30            # Average last 10 epochs
    lr: 5.0e-7

  early_stopping:
    patience: 10
    metric: "val_auc_mean"
    mode: "max"

  save_top_k: 3
  checkpoint_dir: "checkpoints"

# --- Evaluation ---
evaluation:
  optimize_thresholds: true
  threshold_metric: "f1"
  default_threshold: 0.5
  gradcam:
    enabled: false            # ViT attention maps differ from conv CAM; skip for now
    target_layers: "auto"
    num_samples: 50
  metrics:
    - "auc_roc"
    - "auc_pr"
    - "f1"
    - "precision"
    - "recall"
    - "specificity"

# --- Logging ---
logging:
  project_name: "nih-chest-xray"
  use_wandb: true
  log_every_n_steps: 50
  save_figures: true
  figure_dir: "outputs/figures"

# --- Hardware ---
hardware:
  accelerator: "auto"
  strategy: "auto"
  precision: "16-mixed"
